<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost at Sea — Castaway Cross</title>
  <meta name="robots" content="noindex,follow">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --border: #d1d5db;
      --accent: #f59e0b;
      --link: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --text: #f9fafb;
        --muted: #d1d5db;
        --border: #374151;
        --accent: #fbbf24;
        --link: #93c5fd;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, Arial, sans-serif;
      background: radial-gradient(circle at top, color-mix(in srgb, var(--accent) 10%, transparent), transparent 42%), var(--bg);
      color: var(--text);
    }
    .card {
      width: min(680px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      line-height: 1.2;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
    }
    p {
      margin: 14px auto 0;
      max-width: 52ch;
      color: var(--muted);
    }
    a.home-link {
      display: inline-block;
      margin-top: 20px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
      background: color-mix(in srgb, var(--link) 8%, transparent);
    }
    a.home-link:hover,
    a.home-link:focus-visible {
      background: color-mix(in srgb, var(--link) 15%, transparent);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">404 • Island Error</div>
    <h1>Your torch got snuffed.</h1>
    <p>
      Looks like this page missed Tribal Council and got voted out.
      Head back to camp to keep playing Castaway Cross.
    </p>
    <a class="home-link" href="/">Return to the Castaway Cross homepage</a>
  </main>
</body>
</html>
